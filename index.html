function teeOff(cfg, fee, label) {

    if (fee > 0) { if (save.coins < fee) { SFX.play('err'); toast(`Need <b>${fmt(fee - save.coins)}</b> more coins`); return; } save.coins -= fee; save.stats.feesPaid += fee; }

  };
  if (save.round) { confirmBox('This replaces your saved round in progress. Continue?', () => { save.round = null; teeOff(cfg, fee, label); }); return; }
  if (fee > 0) confirmBox(`${label}<br><br><b>${priceHTML(fee)}</b>`, go); else go();
}

  join: v => { const c = courseById(v); confirmBox(`Join <b>${c.name}</b>?<br><br>One-time fee <b>${priceHTML(c.member)}</b>. No more green fees here, ever.`, () => spend(c.member, () => { save.members.push(c.id); toast(`Welcome to <b>${c.name}</b>!`); })); },
  sel_n: v => { const NH = nHoles(courseById(SEL.course)); SEL.n = +v; if (SEL.n === 9 && SEL.start !== 0 && SEL.start !== 9) SEL.start = SEL.start < 9 ? 0 : 9; if (SEL.n >= NH) SEL.start = 0; rerender(); },
  startHole: v => { const NH = nHoles(courseById(SEL.course)), step = SEL.n === 9 ? 9 : 1; SEL.start = clamp(SEL.start + (+v) * step, 0, Math.max(0, NH - SEL.n)); rerender(); },
  sel_tee: v => { SEL.tee = v; rerender(); },
  sel_diff: v => { SEL.diff = v; rerender(); },
  setDiff: v => { save.settings.diff = v; SEL.diff = v; persist(); rerender(); },
  start: () => {
    const c = courseById(SEL.course), wxT = weatherOn(c.id, save.day); if (wxT.rain === 3) return; const fee = isMember(c.id) ? 0 : Math.round(feeFor(c, SEL.n) * wxFeeMult(wxT) / 5) * 5;
    teeOff({ courseId: c.id, n: SEL.n, start: SEL.start, tee: SEL.tee, diff: SEL.diff }, fee, `Green fee at ${c.name} for ${SEL.n} hole${SEL.n > 1 ? 's' : ''}`);
  },
  enterEvent: v => { const E = EVENTS.find(e => e.id === v), idx = save.hcp.index, ec = courseById(E.course);
    if (ec.invite && !augustaOpen()) { SFX.play('err'); showModal(`<div class="col" style="max-width:calc(var(--u)*240)"><div class="u2">INVITATION ONLY</div><div>You need to have played Augusta as a guest first. Reach scratch (0.0) and watch your Golf NZ app inbox.</div><button class="btn g" data-m="close">CLOSE</button></div>`); return; }
    if (ec.abroad && !save.tickets.includes(ec.id)) { SFX.play('err'); showModal(`<div class="col" style="max-width:calc(var(--u)*240)"><div class="u2">✈ PLANE TICKET NEEDED</div><div>${E.name} is at ${ec.name}. Buy a one-time ticket there first (${priceHTML(ec.ticket)}).</div><div class="row"><button class="btn y" data-a="buyTicket" data-v="${ec.id}">BUY TICKET</button><button class="btn g" data-m="close">CLOSE</button></div></div>`); return; }
    if (idx === null) { SFX.play('err'); showModal(`<div class="col" style="max-width:calc(var(--u)*240)"><div class="u2">YOU NEED A HANDICAP</div><div>Events are scored against your handicap, so you need an official index first.</div><div class="u1">Play <b>3 complete rounds</b> (9 or 18 holes, any course, any tees). Your index is worked out from your best scores, like the real World Handicap System. You have <b class="gold">${save.hcp.rounds.length}/3</b>.</div><div class="row"><button class="btn y" data-a="go" data-v="setup">PLAY A ROUND</button><button class="btn g" data-m="close">CLOSE</button></div></div>`); return; }
    if (E.fmt === 'gross' && idx > E.maxIdx) { SFX.play('err'); showModal(`<div class="col" style="max-width:calc(var(--u)*240)"><div class="u2">HANDICAP TOO HIGH</div><div>${E.name} is a gross (scratch) event for handicap <b>${E.maxIdx}</b> or better. You are <b class="gold">${fmtIdx(idx)}</b>.</div><div class="u1">Try the net events: your handicap strokes level the field.</div><button class="btn g" data-m="close">CLOSE</button></div>`); return; } teeOff({ courseId: E.course, n: E.n, start: 0, tee: 'champ', diff: SEL.diff, event: E.id }, E.fee, `Enter the <b>${E.name}</b> on ${DIFFS[SEL.diff].name} difficulty?<br><span class="u1">Entry includes your green fee.</span>`); },
  again: () => { if (!G.lastCfg) { showScreen('setup'); return; } const c = courseById(G.lastCfg.courseId); teeOff(Object.assign({}, G.lastCfg, { event: null }), isMember(c.id) ? 0 : feeFor(c, G.lastCfg.n), `Green fee at ${c.name}`); },
  buyTicket: v => { const c = courseById(v); confirmBox(`Fly to <b>${c.name}</b>?<br><span class="u1">${priceHTML(c.ticket)} once. After that you can play here any time.</span>`, () => { closeModal(); spend(c.ticket, () => { save.tickets.push(v); toast(`✈ Ticket booked: <b>${c.name}</b>`); }); }); },
  openInbox: () => { closeModal(); SEL.appTab = 'inbox'; showScreen('hcpapp'); },
  augustaReply: v => { save.augusta = v === 'yes' ? 'accepted' : 'passed'; persist(); SFX.play(v === 'yes' ? 'good' : 'ui'); rerender(); },
  augustaPlay: v => { const n = +v; save.round = null; G.lastCfg = null; startRound({ courseId: 'augusta', n, start: 0, tee: 'champ', diff: SEL.diff, guest: 'hemi' }); },
  waitDay: () => { save.day++; persist(); SFX.play('page'); rerender(); },
  replay: () => { if (G.summary && G.summary.best) startReplay(G.summary.best); },
  enterSeason: v => { const E = EVENTS.find(e => e.id === v); if (save.hcp.index === null) { ACT.enterEvent(v); return; } teeOff({ courseId: E.course, n: E.n, start: 0, tee: 'champ', diff: SEL.diff, event: E.id, season: true }, E.fee, `Play the <b>${E.name}</b> for season points?<br><span class="u1">Entry includes your green fee.</span>`); },
  drill: v => { SFX.play('ui'); startPractice(v); },
  prTab: v => { SEL.prTab = v; rerender(); },
  appTab: v => { SEL.appTab = v; rerender(); },
  shopTab: v => { SEL.shopTab = v; showScreen('shop'); },
  shopSel: v => { SEL.shopSel[SEL.shopTab] = v; rerender(); },
  btab: v => { SEL.boardTab = v; rerender(); },
  bcourse: v => { SEL.boardCourse = v; rerender(); },
  ttab: v => { SEL.trophyTab = v; rerender(); },
  howTab: v => { SEL.howTab = +v; rerender(); },
  upClub: v => { const c = clubById(v), L = save.clubs[v] || 0; if (L >= CLUB_MAX) return; spend(upCost(c, L), () => { save.clubs[v] = L + 1; save.ups++; toast(`${fullName(c)}: <b>${CLUB_TIERS[L + 1].name}</b>`); }); },
  buyClub: v => { const c = clubById(v); spend(c.price, () => { save.clubs[v] = 0; }); },
  selGolfer: v => { if (!golferUnlocked(save, golferById(v))) return; save.golfer = v; persist(); SFX.play('ui'); rerender(); },
  selCaddie: v => { save.caddie = v || null; persist(); SFX.play('ui'); rerender(); },
  buyCart: v => { const c = CARTS.find(k => k.id === v); confirmBox(`Buy the <b>${c.name}</b> for ${priceHTML(c.price)}?`, () => spend(c.price, () => { save.carts.push(v); save.cart = v; })); },
  selCart: v => { save.cart = v; persist(); SFX.play('ui'); rerender(); },
  buyBall: v => { const b = BALLS.find(k => k.id === v); spend(b.price, () => { save.ballStock[v] = (save.ballStock[v] || 0) + 12; if (!save.balls.includes(v)) save.balls.push(v); if (save.ball === 'std') save.ball = v; }); },
  selBall: v => { save.ball = v; persist(); SFX.play('ui'); rerender(); },
  buyItem: v => { const [id, q] = v.split(':'), it = ITEMS.find(k => k.id === id), n = +q; spend(it.price * (n === 5 ? 4 : 1), () => { save.items[id] = (save.items[id] || 0) + n; }); },
  buyGear: v => { const g = GEAR.find(k => k.id === v); spend(g.price, () => { save.gear[v] = true; }); },
  toggle: v => { save.settings[v] = !save.settings[v]; if (v === 'music' && save.settings.music) { SFX.init(); SFX.startMusic(); } persist(); rerender(); },
  tracer: v => { save.settings.tracer = v; persist(); rerender(); },
  meter: v => { save.settings.meter = +v; persist(); rerender(); },
  saveName: () => { const v = ($('nameIn').value || '').replace(/[<>]/g, '').trim().slice(0, 16); if (v) { save.name = v; persist(); toast('Name saved: <b>' + esc(v) + '</b>'); } },
  export: () => { const code = btoa(unescape(encodeURIComponent(JSON.stringify(save)))); showModal(`<div class="col"><div>YOUR SAVE CODE</div><textarea class="px" readonly>${code}</textarea><div class="row"><button class="btn sm b" data-m="copy">COPY</button><button class="btn sm g" data-m="close">CLOSE</button></div></div>`); },
  import: () => showModal(`<div class="col"><div>PASTE A SAVE CODE</div><textarea class="px"></textarea><div class="row"><button class="btn sm y" data-m="load">LOAD</button><button class="btn sm g" data-m="close">CANCEL</button></div></div>`),
  reset: () => confirmBox('Erase ALL progress, coins and records?', () => { applySave(null); save.seenHelp = true; persist(); newBg(); showScreen('title'); toast('Progress reset'); }),
  buyCeleb: v => { const c = CELEBS.find(k => k.id === v); spend(c.price, () => { save.celebs.push(v); if (save.celebEq.length < 4) save.celebEq.push(v); }); },
  eqCeleb: v => { if (save.celebEq.length < 4 && !save.celebEq.includes(v)) save.celebEq.push(v); persist(); rerender(); },
  unEqCeleb: v => { if (save.celebEq.length > 1) save.celebEq = save.celebEq.filter(x => x !== v); else toast('Keep at least one equipped'); persist(); rerender(); },
  previewCeleb: v => { const c = CELEBS.find(k => k.id === v); showModal(`<div class="col" style="align-items:center;gap:calc(var(--u)*3)"><div class="u2">${c.name.toUpperCase()}</div><canvas id="celPrev" width="90" height="120" style="width:calc(var(--u)*90);image-rendering:pixelated;background:#7cbf55;border:calc(var(--u)*1) solid #23190f"></canvas><button class="btn sm" data-m="close">CLOSE</button></div>`); G.celPrev = { id: v, t: 0 }; },
  chType: v => { SEL.chType = v; rerender(); },
  chCourse: v => { SEL.chCourse = v; rerender(); },
  chStart: () => startChallenge(SEL.chType, SEL.chCourse)
};
UI.addEventListener('click', e => {
  SFX.init(); if (save.settings.music) SFX.startMusic();
  const tro = e.target.closest('[data-m="trophy"]'); if (tro) { SFX.play('ui'); showTrophy(tro.dataset.v); return; }
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const a = el.dataset.a; if (!ACT[a]) return;
  if (!/^buy|^up|^spend|^join/.test(a)) SFX.play('ui');
  ACT[a](el.dataset.v, el);
});
UI.addEventListener('keydown', e => { if (e.target.id === 'nameIn' && e.key === 'Enter') ACT.saveName(); });

/* ---------- main loop ---------- */
function resize() {
  const s = Math.min(innerWidth / VW, innerHeight / VH);
  document.documentElement.style.setProperty('--u', Math.max(.5, s) + 'px');
}
let lastTs = 0;
function drawCelPrev(dt) {
  const cp = G.celPrev, c = $('celPrev'); if (!cp || !c) { G.celPrev = null; return; }
  cp.t += dt; if (cp.t > 2.6) cp.t = 0;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.fillStyle = '#7cbf55'; x.fillRect(0, 0, 90, 120); x.fillStyle = '#6aae47'; x.fillRect(0, 100, 90, 20);
  DC = x; drawGolferFront(golferById(save.golfer), 45, 108, 1.1, frontPose(cp.id, cp.t)); DC = ctx;
}
function frame(ts) {
  const dt = Math.min(.05, (ts - lastTs) / 1000 || 0); lastTs = ts;
  try { if (!modalOpen() || G.scr !== 'game') update(dt); render(); if (G.scr === 'game') drawWind(); if (G.celPrev) drawCelPrev(dt); }
  catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
function boot() {
  loadSave();
  if (save.seenHelp === undefined) save.seenHelp = false;
  resize(); addEventListener('resize', resize);
  newBg();
  SEL.diff = save.settings.diff;
  showScreen(save.seenHelp ? 'title' : 'howto');
  checkAch();
  requestAnimationFrame(frame);
}
boot();
window.__G = G;

</script>
</body>
</html>
